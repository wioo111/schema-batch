[package]
name = "universal-data-refiner"
version = "0.1.0"
description = "Desktop shell for Universal Data Refiner"
authors = ["Universal Data Refiner"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
calamine = "0.26"
csv = "1.3"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
